name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        # Advisory for now: 112 pre-existing lint errors (E501/E722/F841/B007)
        # remain after the safe auto-fix pass. Non-blocking so the test matrix
        # still runs; will be made blocking once the debt is cleared.
        continue-on-error: true
        run: ruff check lra/

      - name: Run tests
        run: pytest tests/ -q
